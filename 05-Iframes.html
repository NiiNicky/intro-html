<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento Iframe. Inline Frame para embutir outros sites."> 
    <title> Sobre Iframes </title>
</head>
<body>
    <h1> Iframe</h1>
    <hr>

    <h2> Para que serve?</h2>
    <p> O Inline Frame é um elemento que nos permite embutir outro documento/conteúdo externo dentro da nossa pagina. É bastnate usado para Youtube, Google Mpas, formulários externos e etc.</p>

    <iframe src="04-imagens.html" frameborder="0"></iframe>

    <hr>
    <h3>Carregando o Youtube</h3>

    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/lIxQe1R5hs0?si=GjNFY3M-jvPoxeHP" 
        title="Youtube video player Stateside Pinkpantheress & Zara Larsson" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

    <h3>Carregando mapas</h3>
    
    <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d190028.7643209635!2d12.5359979!3d41.9100711!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x132f6196f9928ebb%3A0xb90f770693656e38!2zUm9tYSwgSXTDoWxpYQ!5e0!3m2!1spt-BR!2sbr!4v1790172180643!5m2!1spt-BR!2sbr" 
        width="600" 
        height="450" 
        style="border:0;"
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

</body>
</html>
